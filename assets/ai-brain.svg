<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%">
  <rect width="600" height="200" fill="#0b1220" rx="10"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4de8d4" stopOpacity="0"/>
      <stop offset="50%" stopColor="#4de8d4" stopOpacity="1"/>
      <stop offset="100%" stopColor="#4de8d4" stopOpacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Side: Data Nodes (Microfluidic Wells) -->
  <g transform="translate(100, 100)">
    <!-- Connecting lines to AI -->
    <path d="M 20 -40 C 100 -40 150 0 250 0" fill="none" stroke="#24324d" stroke-width="2"/>
    <path d="M 20 0 C 100 0 150 0 250 0" fill="none" stroke="#24324d" stroke-width="2"/>
    <path d="M 20 40 C 100 40 150 0 250 0" fill="none" stroke="#24324d" stroke-width="2"/>
    
    <!-- Animated beams traveling along lines -->
    <path d="M 20 -40 C 100 -40 150 0 250 0" fill="none" stroke="url(#beam)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,300; 300,0" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M 20 0 C 100 0 150 0 250 0" fill="none" stroke="url(#beam)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,300; 300,0" dur="2s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.6s" repeatCount="indefinite" />
    </path>
    <path d="M 20 40 C 100 40 150 0 250 0" fill="none" stroke="url(#beam)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,300; 300,0" dur="2s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.2s" repeatCount="indefinite" />
    </path>

    <!-- Data Nodes -->
    <circle cx="0" cy="-40" r="10" fill="#16213a" stroke="#8ea0bd" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#16213a" stroke="#8ea0bd" stroke-width="2" />
    <circle cx="0" cy="40" r="10" fill="#16213a" stroke="#8ea0bd" stroke-width="2" />
    
    <text x="-25" y="-36" fill="#8ea0bd" font-family="monospace" font-size="10" text-anchor="end">W1 [10µM]</text>
    <text x="-25" y="4" fill="#8ea0bd" font-family="monospace" font-size="10" text-anchor="end">W2 [3.1µM]</text>
    <text x="-25" y="44" fill="#8ea0bd" font-family="monospace" font-size="10" text-anchor="end">W3 [1.0µM]</text>
  </g>

  <!-- Right Side: Gemini AI Core -->
  <g transform="translate(400, 100)">
    <circle cx="0" cy="0" r="40" fill="#121b2e" stroke="#4de8d4" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke-width" values="2;5;2" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <!-- Brain / AI Icon -->
    <path d="M-12,-8 C-20,-8 -20,5 -10,12 C0,20 10,20 20,12 C30,5 30,-8 22,-8 C15,-8 10,-2 5,-2 C0,-2 -5,-8 -12,-8 Z" fill="none" stroke="#e7eef5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5,-2 V12" fill="none" stroke="#e7eef5" stroke-width="2" stroke-linecap="round"/>
    
    <text x="0" y="65" fill="#4de8d4" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="2">
      GEMINI AI
    </text>
    <text x="0" y="80" fill="#8ea0bd" font-family="monospace" font-size="10" text-anchor="middle">
      ANALYSIS CORE
    </text>
  </g>
</svg>
