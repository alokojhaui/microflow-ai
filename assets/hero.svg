<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%">
  <rect width="800" height="280" fill="#0b1220" rx="15"/>
  <defs>
    <linearGradient id="flowGrad" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#f5b942" />
      <stop offset="30%" stopColor="#4de8d4" />
      <stop offset="70%" stopColor="#8ea0bd" />
      <stop offset="100%" stopColor="#f5b942" />
      <animate attributeName="x1" values="-100%; 100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="wellPulse">
      <stop offset="0%" stopColor="#4de8d4" stopOpacity="0.8">
        <animate attributeName="stopOpacity" values="0.8; 0.2; 0.8" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stopColor="#0b1220" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="400" y="70" fill="#e7eef5" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="6">
    MICROFLOW AI
  </text>
  <text x="400" y="95" fill="#8ea0bd" font-family="-apple-system, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="2">
    ORGAN-ON-CHIP ASSAY SIMULATOR
  </text>

  <!-- Microfluidic Channel Animation -->
  <g transform="translate(100, 160)">
    <!-- Base structural track -->
    <path d="M0,0 C80,0 120,-40 180,-40 S230,40 300,40 S360,-40 420,-40 S480,40 550,40 S580,0 600,0"
          fill="none" stroke="#16213a" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Flow track (glowing gradient) -->
    <path d="M0,0 C80,0 120,-40 180,-40 S230,40 300,40 S360,-40 420,-40 S480,40 550,40 S580,0 600,0"
          fill="none" stroke="url(#flowGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
          
    <!-- Droplet nodes simulating wells -->
    <circle cx="180" cy="-40" r="16" fill="#121b2e" stroke="#24324d" stroke-width="4" />
    <circle cx="180" cy="-40" r="8" fill="url(#wellPulse)" />
    
    <circle cx="300" cy="40" r="16" fill="#121b2e" stroke="#24324d" stroke-width="4" />
    <circle cx="300" cy="40" r="8" fill="url(#wellPulse)" />
    
    <circle cx="420" cy="-40" r="16" fill="#121b2e" stroke="#24324d" stroke-width="4" />
    <circle cx="420" cy="-40" r="8" fill="url(#wellPulse)" />
    
    <circle cx="550" cy="40" r="16" fill="#121b2e" stroke="#24324d" stroke-width="4" />
    <circle cx="550" cy="40" r="8" fill="url(#wellPulse)" />
  </g>
</svg>
